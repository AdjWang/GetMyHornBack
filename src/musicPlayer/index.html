<!doctype html>
<html>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Tone Player</title>
<link rel=stylesheet href=style.css>
</head>
<body>
<main class=panel>
  <div class=title>Tone Player</div>
  <pre id=output>Loading tone.txt...</pre>
  <label class=loop>
    <input id=loop type=checkbox checked>
    Loop
  </label>
  <button id=replay type=button>Replay</button>
  <div class=hint>Playback starts on the first click or key press.</div>
</main>

<script>
var soundEnable = true;
var headlessMode = false;
var soundVolume = 1;
var soundDefaultRange = 0;
var soundDefaultTaper = 0.5;
ASSERT = function (cond, ...msg) {
  if (!cond) {
    console.error(...msg);
  }
};
</script>
<script src=../engine/engineMath.js></script>
<script src=../engine/engineAudio.js></script>
<script src=musicPlayer.js></script>
</body>
</html>
