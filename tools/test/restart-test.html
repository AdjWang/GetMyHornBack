<!DOCTYPE html><head>
<title>restart test</title>
<meta charset=utf-8>
<base href="/src/">
</head><body>

<!-- LittleJS Engine -->
<script src=engine/engineDebug.js></script>
<script src=engine/engineMath.js></script>
<script src=engine/engineUtilities.js></script>
<script src=engine/engineSettings.js></script>
<script src=engine/engineObject.js></script>
<script src=engine/engineDraw.js></script>
<script src=engine/engineInput.js></script>
<script src=engine/engineAudio.js></script>
<script src=engine/engineTileLayer.js></script>
<script src=engine/engineParticles.js></script>
<script src=engine/engine.js></script>

<!-- Game -->
<script src=assets/characterResource.js></script>
<script src=rdmath.js></script>
<script src=global.js></script>
<script src=physic.js></script>
<script src=camera.js></script>
<script src=bullet.js></script>
<script src=resourceLoader.js></script>
<script src=background.js></script>
<script src=foreground.js></script>
<script src=effect.js></script>
<script src=monster.js></script>
<script src=unicorn.js></script>
<script src=level.js></script>
<script src=main.js></script>

<script>
// In-place restart regression test. Not part of the game build.
// Everything lives inside this closure so no global name collides with the game.
(async function run() {
  const log = [], errors = [];
  // bumps on every execution of this script; a page reload would re-run it
  const boots = window.__boots = (window.__boots || 0) + 1;
  window.addEventListener('error', e => errors.push('error: ' + e.message));
  window.addEventListener('unhandledrejection', e => errors.push('rejection: ' + e.reason));
  const ok = (cond, msg) => log.push((cond ? 'PASS' : 'FAIL') + ' ' + msg);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const tick = async n => { while (n-- > 0) await sleep(20); };
  const waitFor = async (fn, what, ms = 8000) => {
    const t0 = performance.now();
    while (!fn()) {
      if (performance.now() - t0 > ms) throw new Error('timeout waiting for ' + what);
      await sleep(10);
    }
  };
  // Feed one frame of pressed-key state straight into the engine input table.
  const pressKey = code => { inputData[0][code] = 3; };

  try {
    await waitFor(() => tileLayer && tileLayer.data && characterRes, 'boot');
    const frameAtBoot = frame;
    await tick(10);
    ok(frame > frameAtBoot, 'frames are running in this browser (' + (frame - frameAtBoot) + ' in 200ms)');
    ok(currentLevel === 0, 'boot in level 0');
    ok(player === undefined, 'level 0 waits for the start key');
    ok(comicUnicorns.length === 4 && comicDragons.length === 2, 'comic built once');
    ok(document.hasFocus(), 'document has focus');

    // --- enter level 1 the same way the comic exit does ---
    switchLevel(1);
    await waitFor(() => currentLevel === 1 && player, 'level 1 load');
    await tick(15);
    ok(comicUnicorns.length === 0 && comicDragons.length === 0, 'comic actors cleared, not stacked');
    ok(!!dragon && !dragon.destroyed, 'level 1 dragon rebuilt');
    const objCount = engineObjects.length;
    // Ignore short lived objects: particles, and the emitters that destroy
    // themselves after their emitTime (the unicorn's jump dust lives 0.08s).
    const transient = (o) => {
      const n = o.constructor.name;
      return n === 'Particle' || (n === 'ParticleEmitter' && o.emitTime);
    };
    const countByName = () => engineObjects.reduce((m, o) => {
      const n = o.constructor.name;
      if (!transient(o)) m[n] = (m[n] || 0) + 1;
      return m;
    }, {});
    const objNames = JSON.stringify(countByName());
    ok(savePoints.length > 0, 'level 1 has ' + savePoints.length + ' save points');

    // --- touch a save point for real, through SavePoint.update ---
    const sp = savePoints[0];
    ok(!!sp, 'picked save point 0 at ' + (sp && sp.pos.x.toFixed(1) + ',' + sp.pos.y.toFixed(1)));
    let triggered = false;
    for (let i = 0; i < 40 && !triggered; ++i) {
      if (player) player.pos = sp.pos.copy();
      await sleep(20);
      triggered = sp._saved;
    }
    if (!triggered) {
      log.push('DEBUG frames=' + frame + ' player=' + (player && player.pos.x.toFixed(2) + ',' + player.pos.y.toFixed(2))
        + ' sp=' + sp.pos.x.toFixed(2) + ',' + sp.pos.y.toFixed(2)
        + ' d=' + (player ? sp.pos.distance(player.pos).toFixed(2) : 'n/a')
        + ' inObjects=' + engineObjects.indexOf(sp) + ' saved=' + sp._saved);
    }
    ok(triggered, 'save point triggered by walking the player onto it');
    const saved = JSON.parse(localStorage[STORAGE_PREFIX]);
    ok(saved.level === 1 && saved.idx === 0,
       'save written: ' + JSON.stringify({ level: saved.level, idx: saved.idx, dragon: !!saved.dragon }));

    // --- damage the level, then die ---
    // find a solid tile next to the player and remove it the way an explosion would
    let tilePos;
    for (let x = (player.pos.x | 0) - 4; x < (player.pos.x | 0) + 4 && !tilePos; ++x) {
      for (let y = 2; y < 15; ++y) {
        const p = vec2(x, y);
        if (getTileCollisionData(p) && tileLayer.getData(p)) { tilePos = p; break; }
      }
    }
    ok(!!tilePos, 'found a solid tile to blow up at ' + (tilePos && tilePos.x + ',' + tilePos.y));
    const tileBefore = tileLayer.getData(tilePos).tile;
    const colBefore = getTileCollisionData(tilePos);
    tileLayer.setData(tilePos, new TileLayerData);
    setTileCollisionData(tilePos, 0);
    tileLayer.redraw();
    ok(getTileCollisionData(tilePos) === 0, 'tile removed before the restart');
    if (saved.dragon) dragon.pos = vec2(saved.dragon.x + 10, saved.dragon.y);

    // --- death animation then in-place restart ---
    resetPlayer(true);
    ok(player === undefined || player.destroyed, 'player destroyed by death');
    await waitFor(() => player && !player.destroyed && player.pos, 'respawn after death');
    await tick(15);
    ok(currentLevel === 1, 'restart stayed in level 1 (no page reload)');
    ok(player.pos.distance(sp.pos) < 3, 'player restored at save point, d=' + player.pos.distance(sp.pos).toFixed(2));
    ok(savePoints[0]._saved === true, 'save point lamp lit again');
    ok(getTileCollisionData(tilePos) === colBefore, 'tile collision restored (' + getTileCollisionData(tilePos) + ')');
    const tileRestored = tileLayer.getData(tilePos);
    ok(!!tileRestored && tileRestored.tile === tileBefore,
       'tile data restored (' + (tileRestored && tileRestored.tile) + ' vs ' + tileBefore + ')');
    if (saved.dragon)
      ok(dragon.pos.distance(vec2(saved.dragon.x, saved.dragon.y)) < 5, 'dragon restored from save data');
    else
      log.push('SKIP dragon restore (save point sits before the dragon trigger)');
    const dumpObjects = () => engineObjects.map(o => o.constructor.name === 'ParticleEmitter'
      ? 'Emitter(rate=' + o.emitRate + ',life=' + o.particleTime + ',parent=' + !!o.parent + ')'
      : o.constructor.name).join(' ');
    const leakOk = JSON.stringify(countByName()) === objNames;
    ok(leakOk, 'no object leak across the restart' + (leakOk ? ''
       : ': ' + objNames + ' -> ' + JSON.stringify(countByName()) + ' || ' + dumpObjects()));
    ok(comicUnicorns.length === 0, 'comic still empty outside level 0');

    // --- walk off the right edge of level 1 and 2: the normal way into the
    // boss level, and where a stale player reference used to blow up ---
    player.pos.x = 300;
    await waitFor(() => currentLevel === 2 && player, 'level 2 via the right edge');
    await tick(4);
    ok(currentLevel === 2 && errors.length === 0, 'right edge carried the player into level 2');
    player.pos.x = 300;
    await waitFor(() => currentLevel === 3 && bossLevel && player, 'boss level via the right edge');
    await tick(4);
    const bossObj = bossLevel._boss;
    ok(!!bossObj && !bossObj.destroyed, 'boss level built');
    ok(errors.length === 0, 'no error on the level 2 -> boss transition');
    resetPlayer(false); // what the R key does, no death animation
    await waitFor(() => currentLevel === 3 && bossLevel && bossLevel._boss !== bossObj && player, 'boss restart');
    await tick(4);
    ok(bossObj.destroyed && !bossLevel._boss.destroyed, 'fresh boss object after restart');
    ok(engineObjects.indexOf(bossObj) < 0, 'old boss dropped from the object list');
    ok(player.pos.distance(vec2(15, 13)) < 3, 'boss level player back at its start point');
    ok(bossLevel._bossSlots.length === 6, 'boss slots rebuilt');

    // --- B key inside the boss level: clear progress, drop back to level 0.
    // A page reload used to be what cleared the stale bossLevel global.
    clearProgress();
    resetPlayer(false);
    pressKey('ArrowDown');   // comicUnicorns is empty right now
    let threw = null;
    try { updateLevelEvent(); } catch (e) { threw = e; }
    ok(!threw, 'a frame inside the load gap is safe' + (threw ? ': ' + threw : ''));
    ok(player === undefined, 'no stale player picked from the emptying comic list');
    // prove the gap really is the dangerous state the old code tripped over
    let oldThrew = false;
    try { comicUnicorns[3].setStatic(false); } catch { oldThrew = true; }
    ok(oldThrew, 'comic list really is empty mid-gap');
    await waitFor(() => comicUnicorns.length === 4 && currentLevel === 0 && tileLayer, 'level 0 reload');
    await tick(6);
    ok(comicUnicorns.length === 4 && comicDragons.length === 2, 'level 0 comic rebuilt exactly once');
    ok(frame > frameAtBoot, 'engine loop still running after every restart');

    // --- the normal start key still works afterwards ---
    pressKey('ArrowDown');
    await waitFor(() => player === comicUnicorns[3], 'comic start key');
    ok(player === comicUnicorns[3], 'start key still starts the game');

    // --- walk into a level 0 doorway: the only way out of the comic level ---
    // switchLevel tears the level down mid-loop, so this is where a stale
    // player reference used to blow up inside the render loop.
    player.pos = vec2(30.5, -0.5);
    await waitFor(() => currentLevel === 1 && player, 'doorway switch');
    await tick(4);
    ok(currentLevel === 1, 'doorway carried the player into level 1');
    ok(errors.length === 0, 'no error thrown while leaving level 0: ' + JSON.stringify(errors.slice(0, 2)));
    ok(await (async () => { const f0 = frame; await tick(5); return frame > f0; })(), 'loop alive after leaving level 0');

    // --- nothing above may have reloaded the page ---
    ok(boots === 1, 'no page reload happened during the whole run (script boots: ' + boots + ')');
    ok(performance.getEntriesByType('navigation').length === 1,
       'exactly one document navigation: ' + performance.getEntriesByType('navigation').length);
  } catch (e) {
    errors.push('harness: ' + (e && e.stack || e));
  }
  const summary = log.filter(l => l[0] === 'F').length + ' failures, ' + errors.length + ' errors';
  const pre = document.createElement('pre');
  pre.id = 'test-result';
  pre.textContent = summary + '\n' + log.join('\n') + '\n' + errors.join('\n');
  document.body.appendChild(pre);
})();
</script>
</body>
